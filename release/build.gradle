plugins {
    id "base"
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
}

def releaseVersion = providers.gradleProperty("releaseVersion").orElse("3.1.2")
def dryRunEnabled = providers.gradleProperty("dryRun").map { it.toBoolean() }.orElse(true)
def releaseTarget = providers.gradleProperty("releaseTarget").orElse("release-3.1.2")
def changelogText = providers.fileContents(layout.projectDirectory.file("CHANGELOG.md")).asText
def artifactsDirectory = layout.projectDirectory.dir("artifacts")
def modrinthToken = providers.environmentVariable("MODRINTH_TOKEN")
def curseforgeToken = providers.environmentVariable("CURSEFORGE_TOKEN")

def targetConfig = new groovy.json.JsonSlurper().parse(file("targets.json"))
def selected = targetConfig.sets[releaseTarget.get()] ?: [releaseTarget.get()]
def releases = targetConfig.targets.findAll { release ->
    releaseTarget.get() == "all" || selected.contains(release.branch)
}.collect { release -> release + [key: release.branch.replaceAll(/[-.]/, "_")] }
if (releases.isEmpty() || (releaseTarget.get() != "all" && releases.size() != selected.size())) {
    throw new GradleException("Unknown releaseTarget: ${releaseTarget.get()}")
}
if (releaseTarget.get().startsWith("release-") && releaseTarget.get() != "release-${releaseVersion.get()}") {
    throw new GradleException("Release set does not match requested version")
}

publishMods {
    changelog = changelogText
    version = releaseVersion
    type = STABLE
    dryRun = dryRunEnabled
    maxRetries = 5

    releases.each { release ->
        def artifactName = "easyautocycler-${release.loader}-${release.minecraft}-${releaseVersion.get()}.jar"
        def releaseTitle = releaseVersion.map {
            "Easy Auto Cycler ${it} ${release.minecraft} ${release.loader == 'neoforge' ? 'NeoForge' : release.loader.capitalize()}"
        }

        modrinth("modrinth_${release.key}") {
            accessToken = modrinthToken
            projectId = "L1k78Y2G"
            file = artifactsDirectory.file(artifactName)
            displayName = releaseTitle
            modLoaders.add(release.loader)
            minecraftVersions.add(release.minecraft)
            environment = CLIENT_ONLY

            if (release.loader == "fabric") {
                requires("trade-cycling")
                if (release.minecraft == "26.3") { requires("fabric-api") }
            } else {
                optional("easy-villagers", "trade-cycling")
            }
        }

        curseforge("curseforge_${release.key}") {
            accessToken = curseforgeToken
            projectId = "1242344"
            file = artifactsDirectory.file(artifactName)
            displayName = releaseTitle
            modLoaders.add(release.loader)
            minecraftVersions.add(release.minecraft)
            client = true
            server = false

            if (release.loader == "fabric") {
                requires("trade-cycling")
                if (release.minecraft == "26.3") { requires("fabric-api") }
            } else {
                optional("easy-villagers", "trade-cycling")
            }
        }
    }
}

tasks.register("publishModrinthAll") {
    group = "publishing"
    description = "Publishes every configured Modrinth release."
    dependsOn tasks.matching { it.name.startsWith("publishModrinth_") }
}

tasks.register("publishCurseforgeAll") {
    group = "publishing"
    description = "Publishes every configured CurseForge release."
    dependsOn tasks.matching { it.name.startsWith("publishCurseforge_") }
}
