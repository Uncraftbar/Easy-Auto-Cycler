plugins {
    id 'fabric-loom' version '1.17.0-alpha.5'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${mod_loader}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
java.sourceCompatibility = JavaVersion.VERSION_25
java.targetCompatibility = JavaVersion.VERSION_25

repositories {
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

// Optional 26.3 Trade Cycling jar, used only to launch a local test client.
// Not vendored in git and not a published dependency.
def tradeCyclingTestJar = file('libs/trade-cycling-fabric-1.0.22+26.3.jar')

loom {
    runs {
        client {
            runDir "runs/client-trade-cycling"
            // Test-only launch helper: jump straight into a named singleplayer world so a
            // headless Xvfb gameplay test needs no menu automation.
            //   ./gradlew runClient -PquickPlayWorld=cycworld
            if (project.hasProperty("quickPlayWorld")) {
                programArgs "--quickPlaySingleplayer", project.property("quickPlayWorld")
            }
        }
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        mappings file("mappings/mappings.tiny")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api-base:${fabric_api_base_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-key-mapping-api-v1:${fabric_key_mapping_api_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-screen-api-v1:${fabric_screen_api_version}"
    runtimeOnly "net.fabricmc.fabric-api:fabric-resource-loader-v1:${fabric_resource_loader_version}"
    runtimeOnly "net.fabricmc.fabric-api:fabric-networking-api-v1:${fabric_networking_api_version}"

    // Optional reflection-based integration: no compile-time or published
    // dependency. The 26.3 test jar is a local-only launch input and is not
    // vendored in git; see PORT-STATUS.md for provenance and SHA-1.
    if (tradeCyclingTestJar.exists()) {
        modRuntimeOnly files(tradeCyclingTestJar)
    } else {
        logger.lifecycle("Trade Cycling test jar missing: ${tradeCyclingTestJar}")
    }
}

processResources {
    inputs.property 'version', mod_version

    filesMatching('fabric.mod.json') {
        expand 'version': mod_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

jar {
    from('LICENSE') {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact remapJar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
