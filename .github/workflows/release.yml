name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish
        required: true
        default: 3.1.2
        type: string
      target:
        description: Release set to build and publish
        required: true
        default: release-3.1.2
        type: choice
        options:
          - release-3.1.2
          - keybinding-fixes
          - '26.3'
          - fabric-1.20.1
          - forge-1.20.1
          - fabric-1.21.1
          - neoforge-1.21.1
          - fabric-1.21.11
          - neoforge-1.21.11
          - fabric-26.1.2
          - neoforge-26.1.2
          - fabric-26.2
          - neoforge-26.2
          - fabric-26.3
          - neoforge-26.3
          - all
      publish:
        description: Upload to Modrinth, CurseForge, and GitHub Releases (disabled means dry run)
        required: true
        default: false
        type: boolean
      destination:
        description: Destinations to validate or publish
        required: true
        default: all
        type: choice
        options:
          - all
          - modrinth
          - curseforge

permissions:
  contents: write

concurrency:
  group: easy-auto-cycler-release
  cancel-in-progress: false

jobs:
  plan:
    name: Select release targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve selected branches to immutable commits
        id: plan
        env:
          RELEASE_TARGET: ${{ inputs.target }}
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          version = os.environ['RELEASE_VERSION']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('Expected a stable semantic version')
          config = json.loads(Path('release/targets.json').read_text())
          target = os.environ['RELEASE_TARGET']
          if target.startswith('release-') and target != 'release-' + version:
              raise SystemExit('Release set does not match requested version')
          selected = config['sets'].get(target, [target])
          rows = [dict(row) for row in config['targets'] if target == 'all' or row['branch'] in selected]
          if not rows or (target != 'all' and len(rows) != len(selected)):
              raise SystemExit('Unknown release target')
          for row in rows:
              row['archive'] = 'easyautocycler-' + row['branch']
              row['sha'] = subprocess.check_output(['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/commits/{row['branch']}", '--jq', '.sha'], text=True).strip()
          print(json.dumps(rows, indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('matrix=' + json.dumps(rows, separators=(',', ':')) + '\n')
              out.write(f'count={len(rows)}\n')
          PY

  build:
    name: Build ${{ matrix.branch }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify branch version
        shell: bash
        run: |
          actual_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [[ "$actual_version" != "${{ inputs.version }}" ]]; then
            echo "${{ matrix.branch }} declares $actual_version, expected ${{ inputs.version }}" >&2
            exit 1
          fi

      - name: Build jar
        run: ./gradlew --no-daemon build

      - name: Collect release jar
        shell: bash
        run: |
          jar="build/libs/${{ matrix.archive }}-${{ inputs.version }}.jar"
          test -f "$jar"
          mkdir -p release-artifact
          cp "$jar" release-artifact/

      - name: Upload release jar
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.archive }}
          path: release-artifact/*.jar
          if-no-files-found: error

  publish:
    name: ${{ inputs.publish && 'Publish' || 'Dry run' }} ${{ inputs.version }} (${{ inputs.target }})
    needs: [plan, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release configuration
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download release jars
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release/artifacts
          merge-multiple: true

      - name: Verify release set
        shell: bash
        run: |
          find release/artifacts -maxdepth 1 -type f -name '*.jar' -print | sort
          count="$(find release/artifacts -maxdepth 1 -type f -name '*.jar' | wc -l)"
          expected="${{ needs.plan.outputs.count }}"
          test "$count" -eq "$expected"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run publisher
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          dry_run=true
          if [[ "${{ inputs.publish }}" == "true" ]]; then dry_run=false; fi
          publish_task=publishMods
          if [[ "${{ inputs.destination }}" == "modrinth" ]]; then
            publish_task=publishModrinthAll
          elif [[ "${{ inputs.destination }}" == "curseforge" ]]; then
            publish_task=publishCurseforgeAll
          fi
          ./release/gradlew -p release --no-daemon "$publish_task" \
            -PreleaseVersion="${{ inputs.version }}" \
            -PreleaseTarget="${{ inputs.target }}" \
            -PdryRun="$dry_run"

      - name: Create or update GitHub Release
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ inputs.version }}"
          title="Easy Auto Cycler ${{ inputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file release/CHANGELOG.md
            gh release upload "$tag" release/artifacts/*.jar --clobber
          else
            gh release create "$tag" release/artifacts/*.jar \
              --target "${{ github.sha }}" \
              --title "$title" \
              --notes-file release/CHANGELOG.md
          fi

      - name: Upload dry-run output
        if: ${{ ! inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: publish-dry-run-${{ inputs.version }}-${{ inputs.target }}
          path: release/build
          if-no-files-found: error
