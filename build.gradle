plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    // 7.1.39 is the minimum NeoGradle for NeoForge >= 26.2.0.87 / 26.3: earlier
    // versions fail recompiling patched HolderSet.java (vanilla anonymous
    // contents() override vs public Named.contents()). See NeoForge issue #3518.
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

// Optional 26.3 integration jars used only to launch a local test client.
// Integration itself is reflection-based, so nothing here is a compile-time or
// published dependency, and the jars are not vendored in git (see PORT-STATUS.md).
def easyVillagersTestJar = file('libs/easy-villagers-neoforge-1.1.43+26.3.jar')
def tradeCyclingTestJar = file('libs/trade-cycling-neoforge-1.0.22+26.3.jar')

base {
    archivesName = "${mod_id}-${mod_loader}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main
    }

    client {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        // Dev-only convenience for manual testing: jump straight into a world.
        if (project.hasProperty('quickPlayWorld')) {
            argument '--quickPlaySingleplayer'
            argument project.property('quickPlayWorld')
        }
        if (project.hasProperty('runtimeBothIntegrations')) {
            workingDirectory project.file('runs/client-both')
        } else if (project.hasProperty('runtimeEasyVillagers')) {
            workingDirectory project.file('runs/client-easy-villagers')
        } else if (project.hasProperty('runtimeTradeCycling')) {
            workingDirectory project.file('runs/client-trade-cycling')
        }
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    clientData {
        arguments.addAll '--mod', project.mod_id, '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    if (project.hasProperty('runtimeEasyVillagers') || project.hasProperty('runtimeBothIntegrations')) {
        if (easyVillagersTestJar.exists()) {
            localRuntime files(easyVillagersTestJar)
        } else {
            logger.lifecycle("Easy Villagers test jar missing: ${easyVillagersTestJar}")
        }
    }
    if (project.hasProperty('runtimeTradeCycling') || project.hasProperty('runtimeBothIntegrations')) {
        if (tradeCyclingTestJar.exists()) {
            localRuntime files(tradeCyclingTestJar)
        } else {
            logger.lifecycle("Trade Cycling test jar missing: ${tradeCyclingTestJar}")
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
